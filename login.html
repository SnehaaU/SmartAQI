<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SmartAQI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(120deg, #e0f2fe 0%, #ccfbf1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 420px;
            text-align: center;
        }

        .logo {
            margin-bottom: 1.5rem;
        }

        .logo i {
            font-size: 2.5rem;
            color: #059669;
        }

        .logo h2 {
            color: #064e3b;
            margin-top: 0.5rem;
            font-size: 1.8rem;
        }

        .logo p {
            color: #6b7280;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #374151;
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.8rem;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .input-group input:focus {
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5,150,105,0.1);
        }

        .login-btn {
            width: 100%;
            padding: 0.8rem;
            background: #059669;
            color: white;
            border: none;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }

        .login-btn:hover {
            background: #047857;
            transform: translateY(-2px);
        }

        .register-link {
            margin-top: 1.5rem;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .register-link a {
            color: #059669;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            margin-top: 1rem;
        }

        .back-home a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-home a:hover {
            color: #059669;
        }

        .divider {
            margin: 1.5rem 0;
            border-top: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-wind"></i>
            <h2>Welcome Back!</h2>
            <p>Login to check your city's AQI</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" id="email" placeholder="" required>
            </div>
            <div class="input-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="divider"></div>

        <div class="register-link">
            Don't have an account? <a href="register.html">Sign Up</a>
        </div>
        <div style="margin-top: 0.8rem;">
    <a href="admin.html" 
       style="color:#2563eb; text-decoration:none; font-weight:600; font-size:0.9rem;">
       <i class="fas fa-user-shield"></i> Admin Login
    </a>
</div>
        <div class="back-home">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>

    <script>
        const API_BASE = 'api';

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('Please fill all fields');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    alert(data.error || 'Login failed');
                    return;
                }

                if (data.role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                alert('Cannot connect to server. Start Tomcat and ensure MySQL is running.');
            }
        });
    </script>
</body>
</html>
