<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SmartAQI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(120deg, #e0f2fe 0%, #ccfbf1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-container {
            background: white;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 420px;
            text-align: center;
        }

        .logo {
            margin-bottom: 1.5rem;
        }

        .logo i {
            font-size: 2.5rem;
            color: #059669;
        }

        .logo h2 {
            color: #064e3b;
            margin-top: 0.5rem;
            font-size: 1.8rem;
        }

        .logo p {
            color: #6b7280;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #374151;
            font-weight: 500;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.8rem;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .input-group input:focus {
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5,150,105,0.1);
        }

        .register-btn {
            width: 100%;
            padding: 0.8rem;
            background: #059669;
            color: white;
            border: none;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }

        .register-btn:hover {
            background: #047857;
            transform: translateY(-2px);
        }

        .login-link {
            margin-top: 1.5rem;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .login-link a {
            color: #059669;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            margin-top: 1rem;
        }

        .back-home a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-home a:hover {
            color: #059669;
        }

        .divider {
            margin: 1.2rem 0;
            border-top: 1px solid #e5e7eb;
        }

        .password-hint {
            font-size: 0.7rem;
            color: #9ca3af;
            margin-top: 0.2rem;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <i class="fas fa-leaf"></i>
            <h2>Create Account</h2>
            <p>Join SmartAQI and breathe better</p>
        </div>

        <form id="registerForm">
            <div class="input-group">
                <label><i class="fas fa-user"></i> Full Name</label>
                <input type="text" id="fullname" placeholder="" required>
            </div>
            <div class="input-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" id="email" placeholder="" required>
            </div>
            <div class="input-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="Create password" required>
                <div class="password-hint">Min. 4 characters</div>
            </div>
            <div class="input-group">
                <label><i class="fas fa-check-circle"></i> Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
            </div>
            <button type="submit" class="register-btn">Create Account</button>
        </form>

        <div class="divider"></div>

        <div class="login-link">
            Already have an account? <a href="login.html">Login</a>
        </div>
        <div class="back-home">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>

    <script>
        const API_BASE = 'api';

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (!fullname || !email || !password || !confirm) {
                alert('Please fill all fields');
                return;
            }

            if (password !== confirm) {
                alert('Passwords do not match');
                return;
            }

            if (password.length < 4) {
                alert('Password must be at least 4 characters');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ fullname, email, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    alert(data.error || 'Registration failed');
                    return;
                }

                alert('Account created successfully. Please login.');
                window.location.href = 'login.html';
            } catch (err) {
                alert('Cannot connect to server. Use http://localhost:8080/SmartAQI/register.html with Tomcat running.');
            }
        });
    </script>
</body>
</html>
