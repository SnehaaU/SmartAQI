<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - SmartAQI</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(to right, #1d976c, #93f9b9);
        }

        .login-container{
            width:350px;
            background:white;
            padding:35px;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        .login-container h2{
            text-align:center;
            margin-bottom:25px;
            color:#1d976c;
        }

        .input-group{
            margin-bottom:20px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
        }

        .input-group input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
        }

        .login-btn{
            width:100%;
            padding:12px;
            background:#1d976c;
            color:white;
            border:none;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        .login-btn:hover{
            background:#14845c;
        }

        .back-link{
            text-align:center;
            margin-top:15px;
        }

        .back-link a{
            text-decoration:none;
            color:#1d976c;
            font-weight:bold;
        }

    </style>
</head>

<body>

    <div class="login-container">

        <h2>Admin Login</h2>

        <form id="adminForm">

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="adminEmail" placeholder="" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="" required>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="back-link">
            <a href="login.html">User Login</a>
        </div>

    </div>

    <script>
        const API_BASE = 'api';

        document.getElementById('adminForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    alert(data.error || 'Login failed');
                    return;
                }

                if (data.role !== 'admin') {
                    alert('Access denied. This account is not an admin.\n\nRun database/setup_admin.sql in MySQL to create an admin account.');
                    return;
                }

                window.location.href = 'admin-dashboard.html';
            } catch (err) {
                alert('Cannot connect to server. Start Tomcat and ensure MySQL is running.');
            }
        });
    </script>

</body>
</html>
